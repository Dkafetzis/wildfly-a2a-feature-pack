# Publishes the aggregated Javadoc to the gh-pages branch.

name: Javadoc

on:
  push:
    branches:
      - main

# Required so the deploy action can push to the gh-pages branch.
permissions:
  contents: write

# Serialize deployments so concurrent pushes don't race on the gh-pages branch;
# cancel-in-progress must stay false so runs queue instead of cancelling each other mid-deploy.
concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Don't publish from forks; only the canonical repository owns the docs site.
    if: github.repository == 'rhusar/wildfly-a2a-feature-pack'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Generate aggregated Javadoc
        run: ./mvnw --batch-mode --no-transfer-progress javadoc:aggregate

      - name: Publish to gh-pages under apidocs/${{ github.ref_name }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: target/reports/apidocs
          # Each branch/tag gets its own versioned folder; the action's clean
          # step is scoped to this target-folder, so sibling versions are kept.
          target-folder: apidocs/${{ github.ref_name }}
